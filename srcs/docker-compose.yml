services:

  # 1) MARIADB
  mariadb:
    # Ajout du tag :inception pour respecter la règle "The latest tag is prohibited"
    image: mariadb:inception
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    #chaque image docker a le meme nom que son service
    container_name: mariadb
    #redemarrage en cas de crash
    restart: always
    #.env pour les env var
    env_file: .env
    networks:
      - inception_network
    volumes:
      #volume qui contient la db wordpress
      - db_data:/var/lib/mysql

  # 2) MOTEUR WORDPRESS + PHP-FPM
  wordpress:
    # Ajout du tag :inception meme raison que pour mariadb
    image: wordpress:inception
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: always
    env_file: .env
    networks:
      - inception_network
    volumes:
        #volume qui contient les fichier du site wordpress
      - wp_data:/var/www/html
        #pour etre sur que la db soit lancé avant wordpress
    depends_on:
      - mariadb

  #3) NGINX
  nginx:
    image: nginx:inception
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    env_file: .env
    ports:
      #point d'entrée pour le client via le port 443
      - "443:443"
    networks:
      - inception_network
    volumes:
      #donne acces sur les fichier wordpress pour que nginx puisse lire les ressource statique (en liant wp_data qui est un volume docker a un chemin physique du conteneur en question)
      - wp_data:/var/www/html
    depends_on:
      - wordpress

  #4) LE RESEAU PRIVE
networks:
  inception_network:
    driver: bridge #bridge pour la connexion entre les conteneurs


  #5) LES VOLUMES
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
        #les deux volume doivent stocker les données dans /home/login/data sur la machine physique
      device: /home/jiparcer/data/mariadb


  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jiparcer/data/wordpress
